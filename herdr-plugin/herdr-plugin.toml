id = "herdr-gentle-agents"
name = "Herdr Gentle Agents"
version = "0.4.0"
min_herdr_version = "0.9.4"
description = "Herdr sidebar states for Pi + Gentle Shell agents: oldest running role (explorer, worker, verify, judge) with total count in parentheses only when above one, ask, review, blocked, done, idle, plus exact +N/-N SessionChanges segments and ↑N behind-upstream marker."
platforms = ["linux"]

# Task 5 scaffold: identity metadata only.
#
# min_herdr_version tracks the installed 0.9.4 schema: the plugin reads the
# same pane-metadata transport and snapshot surface (DESIGN.md §2 E8/E10,
# §9), and the installed schema confirms the pane.agent_detected,
# pane.agent_status_changed, pane.exited, and pane.closed event names.
# platforms stays linux-only until the daemon ships: cross-platform scope is
# unresolved (DESIGN.md §10 U6).
#
# [[build]] and [[panes]] are intentionally absent. DESIGN.md
# §10 U1 is resolved (v0.3.1: the consumer emits no toast, so notification
# CLI syntax is moot); U2 uses the verified lifecycle hooks below with
# adaptive polling as fallback. The producer owns the Pi settings paths.
# [[actions]] below holds the verified configure/unconfigure pair plus the
# read-only doctor/whois diagnostics pair (trace stays an explicit-pane CLI).
# Sections below are added only as their commands become verifiable.
#
# Coexistence: single-writer handoff with herdr-pi-tree, which stays installed
# but disabled for gentle-owned panes. No Agents-panel ownership is claimed
# here (DESIGN.md §3 O1, §9).

# Consumer daemon (task 7): poll snapshot → reduce → publish owned gentle_*
# tokens, scoped orphan sweep. Desktop attention is native Herdr (DESIGN §7):
# this daemon emits no notification for any display.
# No-args mode only ensures the daemon is running; --run is the loop.
# Poll cadence is adaptive (10 s baseline, GENTLE_STATUS_POLL_MS-overridable,
# 2 s fast cycle while recent ask activity or send/publish failures are
# observed); DESIGN §10 U2 sets no normative cadence yet, only << 60 s TTL.
[[startup]]
command = ["node", "bin/gentle-status.js"]

# Lifecycle refresh: --refresh ensures the daemon is running and
# requests one coalesced immediate frame without spawning a second writer
# loop; --once stays the existing one-frame public behavior for manual use
# but is not wired here. All four hooks below use event names confirmed in
# the installed 0.9.4 schema; the event payload arrives via HERDR_PLUGIN_EVENT
# / HERDR_PLUGIN_EVENT_JSON. Polling ([[startup]] above) remains the fallback for
# every lifecycle signal, so a missed or undelivered event never sticks.
[[events]]
on = "pane.agent_detected"
command = ["node", "bin/gentle-status.js", "--refresh"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "bin/gentle-status.js", "--refresh"]

[[events]]
on = "pane.exited"
command = ["node", "bin/gentle-status.js", "--refresh"]

[[events]]
on = "pane.closed"
command = ["node", "bin/gentle-status.js", "--refresh"]

# Sidebar wiring (DESIGN.md §5.3 install configuration): the daemon publishes
# presence-encoded gentle_title_* labels plus the exact +N/-N SessionChanges
# segments ($gentle_changes_added/$gentle_changes_deleted) and the ↑N
# behind-upstream marker ($gentle_changes_pull), and
# bin/configure.js appends exactly one marked pi-only
# [ui.sidebar.agents.rows_by_agent] override for canonical agent `pi`. The
# parent [ui.sidebar.agents] table stays user-owned; --apply refuses when an
# unmanaged rows_by_agent override already exists. Action shape mirrors the
# installed herdr-pi-tree convention (action_id/command/description/
# platforms/title, observed via `herdr plugin action list`); platforms stays
# linux-only to match this manifest. No [[build]] hook is wired: the plugin
# ships no build step, so the supported entrypoint is the combined remote
# installer `install.sh`, which installs + enables this plugin, installs the
# Pi package with `pi install`, migrates an owned legacy managed copy of
# extensions/gentle-herdr-state.ts aside, and runs the
# configure action below (public stable example:
# `curl -fsSL https://github.com/jonasotoaguilar/herdr-gentle-agents/releases/latest/download/install.sh | sh`).
# Local development uses `herdr plugin link --enabled ./herdr-plugin`
# followed by the configure action below; the Pi side installs with
# `pi install` (repository root), never as a managed copy.
[[actions]]
id = "configure"
command = ["node", "bin/configure.js", "--apply", "--reload"]
description = "Append (or repair) the managed pi-only [ui.sidebar.agents.rows_by_agent] override (gentle_title_* + exact +N/-N SessionChanges segments + ↑N behind-upstream marker) without touching the user [ui.sidebar.agents] table, then reload."
platforms = ["linux"]
title = "Configure: install the pi-only sidebar override"

[[actions]]
id = "unconfigure"
command = ["node", "bin/configure.js", "--uninstall", "--reload"]
description = "Remove the managed pi-only sidebar override and reload; the user [ui.sidebar.agents] table is left intact. Run before uninstalling."
platforms = ["linux"]
title = "Configure: remove the pi-only sidebar override"

# Read-only diagnostics (docs/diagnostics.md): fixed-argv readers that never
# write state/tokens/config, never start/stop the daemon, and never dump
# raw private tokens, task labels, or review verdicts. trace stays a
# documented explicit-pane CLI: with no static pane id there is no honest
# static action form, so no trace action is wired here.
[[actions]]
id = "doctor"
command = ["node", "bin/gentle-doctor.js"]
description = "Read-only supervision diagnostics: daemon pidfile liveness, producer/token freshness from one agent snapshot, managed sidebar marker scan. Never writes state."
platforms = ["linux"]
title = "Diagnose: read-only daemon/token/sidebar checks"

[[actions]]
id = "whois"
command = ["node", "bin/gentle-whois.js"]
description = "Read-only global pane view (plugin-owned panes; Interrumpido is diagnostic-only, the sidebar is unchanged). Never writes state."
platforms = ["linux"]
title = "Diagnose: read-only global pane view"
