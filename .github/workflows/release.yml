name: Release

# Per-package tag releases. No PR required.
# Flow: git tag -a pi-vX.Y.Z (or herdr-vX.Y.Z) + git push origin <tag>
#   -> preflight -> release -> verify.
#
# Tag series (exactly two, strict semver, no prerelease or build metadata):
#   pi-vX.Y.Z     the Pi package (package.json, npm name
#                 @jonasotoaguilar/herdr-gentle-shell). Runs the shared gate,
#                 publishes the npm package, AND creates the GitHub Release
#                 with the installer assets.
#   herdr-vX.Y.Z  the Herdr plugin (herdr-plugin/herdr-plugin.toml). Runs the
#                 same shared gate and creates the GitHub Release with the
#                 installer assets only. Its release job runs no npm command and
#                 reaches no registry — every npm step is gated to the pi series
#                 — though the shared preflight still runs `npm pack --dry-run`
#                 for both series to check the tarball surface, which needs no
#                 registry access. The bare v* series is rejected.
# Either series attaches install.sh + install.sh.sha256 so the stable
# releases/latest/download/install.sh entrypoint keeps resolving.
#
# npm authentication is Trusted Publishing (OIDC), never a token: the release
# job holds `id-token: write`, npm exchanges that assertion for a short-lived
# registry token, and the publish carries a provenance attestation bound to
# this repository. No NPM_TOKEN/NODE_AUTH_TOKEN exists in this workflow or in
# the `release` environment, so a missing or broken trusted-publisher binding
# fails loudly instead of falling back to a long-lived credential. The binding
# is created on npmjs.com against this exact workflow filename (release.yml)
# and this environment name (release).
#
# BOOTSTRAP: npm cannot publish the FIRST version of a package through OIDC —
# the trusted-publisher settings page only exists once the package does (npm
# documents no pending-publisher flow; npm/cli#8544 tracks the gap). The first
# version is therefore published once by hand (`npm publish --access public`
# with 2FA; no token is created or stored anywhere), the trusted publisher is
# configured against it, and every later version releases from a tag. The
# publish step below is idempotent per version for exactly that reason: a tag
# whose version the registry already has still creates the GitHub Release
# instead of failing on an impossible republish.
# The base GitHub Release (with automatic notes) is created at release time by
# scripts/release-publish (gh release create --generate-notes). Curation of the
# title and notes happens afterwards by editing the published release in place.

on:
  push:
    tags:
      - "pi-v*"
      - "herdr-v*"
      - "!pi-v*-*"
      - "!herdr-v*-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run release preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! -x ./scripts/release-preflight ]]; then
            echo "::error::Missing executable scripts/release-preflight"
            exit 1
          fi
          ./scripts/release-preflight

  release:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    # Base authority creates/updates the GitHub release. The pi-v series also
    # publishes the npm package below, and that publish mints its provenance
    # attestation from this job's OIDC token.
    permissions:
      contents: write
      # Trusted publishing: without this the publish step fails loudly instead
      # of falling back to a token.
      id-token: write
    env:
      GITHUB_TOKEN: ""
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node for npm publish
        if: startsWith(github.ref_name, 'pi-v')
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Pi series only, like the publish itself: the herdr series runs no npm
      # command in this job and reaches no registry, so a registry outage must
      # not fail its GitHub Release. Trusted publishing needs npm >= 11.5.1, and
      # the pinned major requires Node ^22.22.2 || ^24.15.0 || >=26, which
      # `node-version: 22` tracks today.
      - name: Install npm 12 (trusted publishing requirement)
        if: startsWith(github.ref_name, 'pi-v')
        run: npm install -g npm@12

      # Pi series only, and skipped entirely on herdr-v tags. Publishing is
      # idempotent per version: npm cannot republish a version, so a tag whose
      # version the registry already has — the by-hand bootstrap publish of a
      # new package, or a re-run after a later step failed — is reported and
      # the GitHub Release below is still created. A version the registry does
      # NOT have is published with provenance through the OIDC exchange, which
      # fails loudly when the trusted publisher is not bound to this workflow
      # and environment.
      - name: Publish Pi package to npm
        if: startsWith(github.ref_name, 'pi-v')
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::warning::npm already has ${name}@${version}: publishing is skipped and the GitHub Release is still created"
          else
            npm publish --access public --provenance
          fi

      # Creates the GitHub Release with automatic base notes and the
      # install.sh assets in one call, so a failed upload leaves a draft
      # instead of a live asset-less release. Runs for BOTH series (pi-v and
      # herdr-v). Example:
      #   sha256sum install.sh > install.sh.sha256
      #   gh release create "$RELEASE_TAG" install.sh install.sh.sha256 \
      #     --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --generate-notes
      # An existing draft is deleted (release only, never --cleanup-tag) and
      # recreated; an existing published release keeps refusing to overwrite.
      # Notes are curated afterwards by editing the published release in place;
      # never from a PR body and never from a repo notes file.
      - name: Run release publisher
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! -x ./scripts/release-publish ]]; then
            echo "::error::Missing executable scripts/release-publish"
            exit 1
          fi
          ./scripts/release-publish

      - name: Remove temporary release material
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/release-material"
          test ! -e "$RUNNER_TEMP/release-material"

  verify:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! -x ./scripts/release-verify ]]; then
            echo "::error::Missing executable scripts/release-verify"
            exit 1
          fi
          ./scripts/release-verify
